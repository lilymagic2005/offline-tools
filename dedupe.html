<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><title>文字去重與排序 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">文本去重與排序</h2>
          <p class="text-xs text-slate-500">快速清理重複排班名冊或整理數據清單</p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg border border-slate-300">範例數據</button>
          <button onclick="clearAll()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs rounded-lg border border-slate-300">清空</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <button onclick="process('dedupe')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg hover:border-blue-500 text-xs font-semibold">✨ 去除重複行</button>
        <button onclick="process('sort-asc')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg hover:border-blue-500 text-xs font-semibold">🔤 自然升序 (A-Z / 1-9)</button>
        <button onclick="process('sort-desc')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg hover:border-blue-500 text-xs font-semibold">🔡 自然降序 (Z-A / 9-1)</button>
        <button onclick="process('sort-len')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg hover:border-blue-500 text-xs font-semibold">📏 依長度排序</button>
        <button onclick="process('reverse')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg hover:border-blue-500 text-xs font-semibold">🔄 倒序反轉</button>
        <label class="flex items-center gap-1.5 text-xs text-slate-700 ml-2 cursor-pointer select-none"><input type="checkbox" id="opt-trim" checked class="rounded text-blue-600"> 去空格</label>
        <label class="flex items-center gap-1.5 text-xs text-slate-700 ml-2 cursor-pointer select-none"><input type="checkbox" id="opt-empty" checked class="rounded text-blue-600"> 移空行</label>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span class="font-bold text-slate-700">原始輸入 (每行一筆)</span>
            <span id="stat-in" class="font-mono-num text-xs text-slate-400">0 行</span>
          </div>
          <textarea id="txt-in" rows="14" oninput="updateInStats()" placeholder="貼上名單..." class="w-full font-mono-num text-sm p-3.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5">
            <span class="font-bold text-slate-700">處理結果</span>
            <div class="flex items-center gap-2">
              <span id="stat-out" class="font-mono-num text-xs text-slate-400">0 行</span>
              <button onclick="Utils.copyText('txt-out', this)" class="px-2.5 py-0.5 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold rounded">複製結果</button>
            </div>
          </div>
          <textarea id="txt-out" rows="14" readonly placeholder="結果顯示在此..." class="w-full font-mono-num text-sm p-3.5 bg-slate-100/70 border border-slate-300 rounded-xl"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    function updateInStats() {
      const v = document.getElementById('txt-in').value;
      const total = v ? v.split(/\r?\n/).length : 0;
      document.getElementById('stat-in').textContent = `${total} 行`;
    }

    function process(act) {
      const trim = document.getElementById('opt-trim').checked;
      const rem = document.getElementById('opt-empty').checked;
      let lines = document.getElementById('txt-in').value.split(/\r?\n/);
      
      if (trim) lines = lines.map(l => l.trim());
      if (rem) lines = lines.filter(Boolean);
      const total = lines.length;

      if (act === 'dedupe') {
        lines = Array.from(new Set(lines));
      } else if (act === 'sort-asc') {
        lines = Array.from(new Set(lines)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      } else if (act === 'sort-desc') {
        lines = Array.from(new Set(lines)).sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }));
      } else if (act === 'sort-len') {
        lines = Array.from(new Set(lines)).sort((a, b) => a.length - b.length || a.localeCompare(b));
      } else if (act === 'reverse') {
        lines.reverse();
      }

      document.getElementById('txt-out').value = lines.join('\n');
      document.getElementById('stat-in').textContent = `${total} 行`;
      document.getElementById('stat-out').textContent = `${lines.length} 行 (重複排除 ${Math.max(0, total - lines.length)})`;
    }

    function loadSample() {
      document.getElementById('txt-in').value = `Item 10\nItem 2\nItem 1\nItem 20\nItem 2\nItem 3`;
      updateInStats();
      process('sort-asc');
    }

    function clearAll() {
      document.getElementById('txt-in').value = ''; 
      document.getElementById('txt-out').value = '';
      document.getElementById('stat-in').textContent = '0 行'; 
      document.getElementById('stat-out').textContent = '0 行';
    }
  </script>
</body>
</html>
