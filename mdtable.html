<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Markdown 表格格式化器 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">Markdown 表格對齊與格式化美化器</h2>
          <p class="text-xs text-slate-500">自動計算各欄位寬度並填充空格，呈現工整的 Markdown 原始碼</p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300">載入範例</button>
          <button onclick="clearText()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-semibold rounded-lg border border-slate-300">清空</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="formatTable('left')" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 shadow-xs">靠左對齊 (:---)</button>
          <button onclick="formatTable('center')" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 shadow-xs">置中對齊 (:---:)</button>
          <button onclick="formatTable('right')" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 shadow-xs">靠右對齊 (---:)</button>
        </div>
        <button onclick="Utils.copyText('md-out', this)" class="px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold rounded-lg hover:bg-blue-100">複製 Markdown 表格</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div>
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
            <span>未對齊的 Markdown 表格輸入</span>
          </div>
          <textarea id="md-in" rows="18" oninput="formatTable()" placeholder="| col1 | col2 |\n|---|---|\n| a | b |" class="w-full font-mono-num text-xs sm:text-sm p-3.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
            <span>等寬美化後的 Markdown 表格</span>
          </div>
          <textarea id="md-out" rows="18" readonly class="w-full font-mono-num text-xs sm:text-sm p-3.5 bg-slate-100/70 border border-slate-300 rounded-xl focus:outline-none"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    function formatTable(align = 'keep') {
      const raw = document.getElementById('md-in').value;
      const out = document.getElementById('md-out');
      if (!raw.trim()) { out.value = ''; return; }

      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.includes('|'));
      if (lines.length < 2) { out.value = raw; return; }

      const rows = lines.map(line => {
        let content = line;
        if (content.startsWith('|')) content = content.slice(1);
        if (content.endsWith('|')) content = content.slice(0, -1);
        return content.split('|').map(c => c.trim());
      });

      const colCount = Math.max(...rows.map(r => r.length));
      const colWidths = Array(colCount).fill(3);

      rows.forEach(r => {
        r.forEach((cell, idx) => {
          colWidths[idx] = Math.max(colWidths[idx], cell.length);
        });
      });

      const formatted = rows.map((r, rowIdx) => {
        if (rowIdx === 1) {
          return '| ' + colWidths.map(w => {
            if (align === 'center') return ':' + '-'.repeat(Math.max(1, w - 2)) + ':';
            if (align === 'right') return '-'.repeat(Math.max(2, w - 1)) + ':';
            if (align === 'left') return ':' + '-'.repeat(Math.max(2, w - 1));
            return '-'.repeat(w);
          }).join(' | ') + ' |';
