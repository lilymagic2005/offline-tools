<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>JSON 格式化排版與多對象處理 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }

    .resizer {
      width: 8px;
      cursor: col-resize;
      background-color: transparent;
      transition: background-color 0.15s ease;
      touch-action: none;
    }
    .resizer:hover, .resizer.dragging {
      background-color: #3b82f6;
    }

    .json-tree {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .json-node { margin-left: 18px; }
    .json-toggle {
      display: inline-block;
      width: 14px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      color: #94a3b8;
      font-size: 10px;
      margin-right: 2px;
      transition: transform 0.1s ease;
    }
    .json-toggle:hover { color: #2563eb; }
    .json-toggle.collapsed { transform: rotate(-90deg); }
    .json-key { color: #0f766e; font-weight: 600; }
    .json-string { color: #b45309; }
    .json-number { color: #2563eb; }
    .json-boolean { color: #9333ea; font-weight: 600; }
    .json-null { color: #64748b; font-style: italic; }
    .json-badge {
      display: none;
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      padding: 1px 6px;
      border-radius: 4px;
      margin: 0 4px;
    }
    .json-children.collapsed { display: none; }
    .json-children.collapsed + .json-badge { display: inline-block; }
    mark.highlight {
      background-color: #fef08a;
      color: #854d0e;
      padding: 0 2px;
      border-radius: 2px;
      box-shadow: 0 0 0 1px #facc15;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">JSON 格式化排版與多對象處理</h2>
          <p class="text-xs text-slate-500">支援樹狀展開/摺疊、關鍵字搜尋高亮、連續多個 JSON 或 NDJSON 解析</p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadSampleMultiple()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg border border-slate-300 transition-colors">載入多筆範例</button>
          <button onclick="clearText()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-semibold rounded-lg border border-slate-300 transition-colors">清空輸入</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="formatAll(2)" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 transition-colors shadow-xs">2 空格縮排</button>
          <button onclick="formatAll(4)" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 transition-colors shadow-xs">4 空格縮排</button>
          <button onclick="minifyAll()" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 transition-colors shadow-xs">全部壓縮 (Minify)</button>
          <button onclick="toNdjson()" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 transition-colors shadow-xs">轉為 NDJSON</button>
          
          <label class="flex items-center gap-1.5 text-xs text-slate-700 ml-2 cursor-pointer select-none">
            <input type="checkbox" id="opt-merge-array" checked class="rounded text-blue-600 focus:ring-blue-500">
            <span>多筆合併為陣列 [ ... ]</span>
          </label>
        </div>

        <div class="text-xs text-slate-400 hidden sm:block">
          雙擊中間調節軸可恢復 50:50 等寬
        </div>
      </div>

      <div id="status-bar" class="hidden p-2.5 rounded-lg text-xs font-mono-num font-medium"></div>

      <div id="split-container" class="flex flex-col lg:flex-row w-full gap-0 select-none overflow-hidden rounded-xl border border-slate-300 bg-slate-200">
        
        <!-- 左側：輸入區 -->
        <div id="left-pane" class="flex flex-col bg-white p-3.5 min-w-[200px]" style="width: 48%;">
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-2 select-none">
            <div class="flex items-center gap-1.5">
              <span>📝 原始輸入 (Input)</span>
            </div>
            <span id="in-count" class="font-mono-num font-normal text-slate-400">0 字元</span>
          </div>
          <textarea id="json-in" rows="23" oninput="updateCharCount()" placeholder="在此貼上一個或多個 JSON 對象、NDJSON 或連續 JSON..." class="w-full flex-1 font-mono-num text-xs sm:text-sm p-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none transition-colors"></textarea>
        </div>

        <!-- 中間：拖曳調節軸 -->
        <div id="drag-bar" class="hidden lg:flex resizer items-center justify-center bg-slate-200 border-x border-slate-300 shrink-0 select-none" title="按住左右拖曳調整寬度，雙擊恢復 1:1">
          <div class="w-0.5 h-8 bg-slate-400 rounded-full pointer-events-none"></div>
        </div>

        <!-- 右側：輸出區 -->
        <div id="right-pane" class="flex flex-col bg-white p-3.5 min-w-[200px] flex-1">
          <div class="flex flex-wrap justify-between items-center gap-2 mb-2 select-none">
            <div class="flex items-center gap-1.5">
              <div class="inline-flex p-0.5 bg-slate-100 rounded-lg border border-slate-200 text-xs">
                <button id="view-tree-btn" onclick="setViewMode('tree')" class="px-2.5 py-1 font-bold rounded-md bg-white text-blue-600 shadow-xs">樹狀檢視</button>
                <button id="view-raw-btn" onclick="setViewMode('raw')" class="px-2.5 py-1 font-semibold rounded-md text-slate-600 hover:text-slate-900">原始文本</button>
              </div>

              <div id="tree-controls" class="flex items-center gap-1 ml-1">
                <button onclick="expandAllTree(true)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded border border-slate-200" title="全部展開">展開全部</button>
                <button onclick="expandAllTree(false)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded border border-slate-200" title="全部摺疊">摺疊全部</button>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div class="relative flex items-center">
                <input 
                  type="text" 
                  id="search-input" 
                  oninput="handleSearch(this.value)" 
                  placeholder="搜尋 Key 或 Value..." 
                  class="text-xs pl-6 pr-14 py-1 bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 w-36 sm:w-44 transition-all"
                >
                <span class="absolute left-2 text-slate-400 text-xs">🔍</span>
                <span id="search-count" class="absolute right-2 text-[10px] text-slate-400 font-mono-num pointer-events-none"></span>
              </div>
              <button onclick="Utils.copyText('json-out-raw', this)" class="px-2.5 py-1 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold rounded hover:bg-blue-100 transition-colors">複製結果</button>
            </div>
          </div>

          <div id="json-tree-container" class="w-full flex-1 p-3 bg-slate-50 border border-slate-200 rounded-lg overflow-auto max-h-[550px] min-h-[300px]">
            <div id="tree-root" class="json-tree text-slate-700">等待輸入並執行格式化...</div>
          </div>

          <textarea id="json-out-raw" rows="23" readonly placeholder="格式化後的結果將顯示在此處..." class="hidden w-full flex-1 font-mono-num text-xs sm:text-sm p-3 bg-slate-100/70 border border-slate-200 rounded-lg focus:outline-none resize-none"></textarea>
        </div>

      </div>

    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const container = document.getElementById('split-container');
    const leftPane = document.getElementById('left-pane');
    const dragBar = document.getElementById('drag-bar');
    let isDragging = false;

    dragBar.addEventListener('mousedown', function (e) {
      if (window.innerWidth < 1024) return;
      isDragging = true;
      dragBar.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', function (e) {
      if (!isDragging) return;
      const containerRect = container.getBoundingClientRect();
      const offsetLeft = e.clientX - containerRect.left;
      const totalWidth = containerRect.width;

      let percentage = (offsetLeft / totalWidth) * 100;
      if (percentage < 20) percentage = 20;
      if (percentage > 80) percentage = 80;
      leftPane.style.width = percentage + '%';
    });

    window.addEventListener('mouseup', function () {
      if (isDragging) {
        isDragging = false;
        dragBar.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    dragBar.addEventListener('dblclick', function () {
      leftPane.style.width = '50%';
    });

    let currentParsedData = null;
    let currentSearchTerm = '';
    let currentViewMode = 'tree';

    function extractJsonObjects(text) {
      const trimmed = text.trim();
      if (!trimmed) return [];

      try {
        return [JSON.parse(trimmed)];
      } catch (e) {}

      const lines = trimmed.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let lineParsed = [];
      let allLinesValid = lines.length > 1;

      if (allLinesValid) {
        for (let i = 0; i < lines.length; i++) {
          try {
            lineParsed.push(JSON.parse(lines[i]));
          } catch (err) {
            allLinesValid = false;
            break;
          }
        }
        if (allLinesValid && lineParsed.length > 0) return lineParsed;
      }

      const results = [];
      let depth = 0;
      let inString = false;
      let escape = false;
      let startIndex = -1;

      for (let i = 0; i < trimmed.length; i++) {
        const char = trimmed[i];
        if (escape) { escape = false; continue; }
        if (char === '\\') { escape = true; continue; }
        if (char === '"') { inString = !inString; continue; }

        if (!inString) {
          if (char === '{' || char === '[') {
            if (depth === 0) startIndex = i;
            depth++;
          } else if (char === '}' || char === ']') {
            depth--;
            if (depth === 0 && startIndex !== -1) {
              const snippet = trimmed.slice(startIndex, i + 1);
              results.push(JSON.parse(snippet));
              startIndex = -1;
            }
          }
        }
      }

      if (depth !== 0) throw new Error('括號未閉合，JSON 語法不完整');
      if (results.length === 0) JSON.parse(trimmed);
      return results;
    }

    function showStatus(isSuccess, msg) {
      const bar = document.getElementById('status-bar');
      bar.className = isSuccess 
        ? 'p-2.5 rounded-lg text-xs font-mono-num bg-emerald-50 text-emerald-700 border border-emerald-200'
        : 'p-2.5 rounded-lg text-xs font-mono-num bg-rose-50 text-rose-700 border border-rose-200';
      bar.textContent = msg;
      bar.classList.remove('hidden');
    }

    function updateCharCount() {
      const inVal = document.getElementById('json-in').value;
      document.getElementById('in-count').textContent = `${inVal.length} 字元`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(text, keyword) {
      const escapedText = escapeHtml(text);
      if (!keyword) return escapedText;
      const reg = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escapedText.replace(reg, '<mark class="highlight">$1</mark>');
    }

    function buildTreeDom(value, key = null, isLast = true, keyword = '') {
      const container = document.createElement('div');
      container.className = 'json-item relative';

      const type = value === null ? 'null' : typeof value;
      const isObject = type === 'object';
      const isArray = Array.isArray(value);

      const line = document.createElement('div');
      line.className = 'json-line flex items-start';

      const toggle = document.createElement('span');
      if (isObject && value !== null) {
        toggle.className = 'json-toggle';
        toggle.textContent = '▼';
        toggle.onclick = (e) => {
          e.stopPropagation();
          const children = container.querySelector(':scope > .json-children');
          const isCollapsed = children.classList.toggle('collapsed');
          toggle.classList.toggle('collapsed', isCollapsed);
        };
      } else {
        toggle.className = 'inline-block w-[16px]';
      }
      line.appendChild(toggle);

      if (key !== null) {
        const keyEl = document.createElement('span');
        keyEl.className = 'json-key mr-1';
        keyEl.innerHTML = `"${highlightText(key, keyword)}":`;
        line.appendChild(keyEl);
      }

      if (isObject && value !== null) {
        const openBracket = isArray ? '[' : '{';
        const closeBracket = isArray ? ']' : '}';
        const keys = Object.keys(value);
        const count = keys.length;

        const openEl = document.createElement('span');
        openEl.className = 'text-slate-500 font-bold';
        openEl.textContent = openBracket;
        line.appendChild(openEl);

        const badge = document.createElement('span');
        badge.className = 'json-badge';
        badge.textContent = isArray ? `${count} items` : `${count} keys`;
        line.appendChild(badge);

        container.appendChild(line);

        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'json-children json-node border-l border-slate-200 pl-2';

        keys.forEach((childKey, index) => {
          const childNode = buildTreeDom(value[childKey], isArray ? null : childKey, index === keys.length - 1, keyword);
          childrenContainer.appendChild(childNode);
        });

        container.appendChild(childrenContainer);

        const closeEl = document.createElement('div');
        closeEl.className = 'text-slate-500 font-bold ml-[16px]';
        closeEl.textContent = `${closeBracket}${isLast ? '' : ','}`;
        container.appendChild(closeEl);

      } else {
        const valEl = document.createElement('span');
        if (type === 'string') {
          valEl.className = 'json-string';
          valEl.innerHTML = `"${highlightText(value, keyword)}"`;
        } else if (type === 'number') {
          valEl.className = 'json-number';
          valEl.innerHTML = highlightText(value, keyword);
        } else if (type === 'boolean') {
          valEl.className = 'json-boolean';
          valEl.innerHTML = highlightText(value, keyword);
        } else if (type === 'null') {
          valEl.className = 'json-null';
          valEl.innerHTML = 'null';
        }
        line.appendChild(valEl);

        if (!isLast) {
          const comma = document.createElement('span');
          comma.className = 'text-slate-400';
          comma.textContent = ',';
          line.appendChild(comma);
        }

        container.appendChild(line);
      }

      return container;
    }

    function renderTree(keyword = '') {
      const root = document.getElementById('tree-root');
      root.innerHTML = '';

      if (!currentParsedData) {
        root.innerHTML = '<span class="text-slate-400">尚無內容可顯示</span>';
        return;
      }

      const dom = buildTreeDom(currentParsedData, null, true, keyword);
      root.appendChild(dom);

      if (keyword.trim()) {
        const matches = root.querySelectorAll('mark.highlight');
        document.getElementById('search-count').textContent = `找到 ${matches.length} 處`;
        
        matches.forEach(m => {
          let parent = m.closest('.json-children');
          while (parent) {
            parent.classList.remove('collapsed');
            const parentToggle = parent.previousElementSibling?.querySelector('.json-toggle');
            if (parentToggle) parentToggle.classList.remove('collapsed');
            parent = parent.parentElement?.closest('.json-children');
          }
        });
      } else {
        document.getElementById('search-count').textContent = '';
      }
    }

    function expandAllTree(isExpand) {
      const allChildren = document.querySelectorAll('.json-children');
      const allToggles = document.querySelectorAll('.json-toggle');

      allChildren.forEach(c => c.classList.toggle('collapsed', !isExpand));
      allToggles.forEach(t => t.classList.toggle('collapsed', !isExpand));
    }

    let searchTimer = null;
    function handleSearch(term) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentSearchTerm = term.trim();
        renderTree(currentSearchTerm);
      }, 150);
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      const treeContainer = document.getElementById('json-tree-container');
      const rawText = document.getElementById('json-out-raw');
      const btnTree = document.getElementById('view-tree-btn');
      const btnRaw = document.getElementById('view-raw-btn');
      const treeControls = document.getElementById('tree-controls');

      if (mode === 'tree') {
        treeContainer.classList.remove('hidden');
        rawText.classList.add('hidden');
        treeControls.classList.remove('hidden');
        btnTree.className = 'px-2.5 py-1 font-bold rounded-md bg-white text-blue-600 shadow-xs';
        btnRaw.className = 'px-2.5 py-1 font-semibold rounded-md text-slate-600 hover:text-slate-900';
      } else {
        treeContainer.classList.add('hidden');
        rawText.classList.remove('hidden');
        treeControls.classList.add('hidden');
        btnRaw.className = 'px-2.5 py-1 font-bold rounded-md bg-white text-blue-600 shadow-xs';
        btnTree.className = 'px-2.5 py-1 font-semibold rounded-md text-slate-600 hover:text-slate-900';
      }
    }

    function setOutput(rawStr, parsedObj) {
      document.getElementById('json-out-raw').value = rawStr;
      currentParsedData = parsedObj;
      renderTree(currentSearchTerm);
    }

    function formatAll(indent) {
      const inputVal = document.getElementById('json-in').value;
      const merge = document.getElementById('opt-merge-array').checked;
      try {
        const items = extractJsonObjects(inputVal);
        if (items.length === 0) {
          setOutput('', null);
          return;
        }

        if (items.length === 1) {
          setOutput(JSON.stringify(items[0], null, indent), items[0]);
          showStatus(true, `✓ 成功解析 1 個 JSON 對象並排版`);
        } else if (merge) {
          setOutput(JSON.stringify(items, null, indent), items);
          showStatus(true, `✓ 成功解析 ${items.length} 個 JSON 對象，已合併為陣列排版`);
        } else {
          setOutput(items.map(obj => JSON.stringify(obj, null, indent)).join('\n\n'), items);
          showStatus(true, `✓ 成功解析 ${items.length} 個獨立 JSON 對象並排版`);
        }
      } catch (e) {
        showStatus(false, `✕ JSON 語法錯誤: ${e.message}`);
      }
    }

    function minifyAll() {
      const inputVal = document.getElementById('json-in').value;
      const merge = document.getElementById('opt-merge-array').checked;
      try {
        const items = extractJsonObjects(inputVal);
        if (items.length === 0) {
          setOutput('', null);
          return;
        }

        if (items.length === 1) {
          setOutput(JSON.stringify(items[0]), items[0]);
          showStatus(true, `✓ 已壓縮 1 個 JSON 對象`);
        } else if (merge) {
          setOutput(JSON.stringify(items), items);
          showStatus(true, `✓ 已將 ${items.length} 個 JSON 對象合併為單一陣列並壓縮`);
        } else {
          setOutput(items.map(obj => JSON.stringify(obj)).join(' '), items);
          showStatus(true, `✓ 已壓縮 ${items.length} 個獨立 JSON 對象`);
        }
      } catch (e) {
        showStatus(false, `✕ JSON 語法錯誤: ${e.message}`);
      }
    }

    function toNdjson() {
      const inputVal = document.getElementById('json-in').value;
      try {
        let items = extractJsonObjects(inputVal);
        if (items.length === 0) {
          setOutput('', null);
          return;
        }

        if (items.length === 1 && Array.isArray(items[0])) {
          items = items[0];
        }

        setOutput(items.map(obj => JSON.stringify(obj)).join('\n'), items);
        showStatus(true, `✓ 成功轉換為 NDJSON (共 ${items.length} 行)`);
      } catch (e) {
        showStatus(false, `✕ 轉換錯誤: ${e.message}`);
      }
    }

    function loadSampleMultiple() {
      document.getElementById('json-in').value = 
`{"id": 101, "name": "離線工具箱", "active": true, "author": {"name": "Simon", "role": "Developer"}, "tags": ["tool", "json", "fast"]}
{"id": 102, "name": "文本差異比對", "active": false, "author": {"name": "Benny", "role": "Tester"}, "tags": ["diff", "text"]}
{"id": 103, "name": "子網掩碼計算器", "active": true, "author": {"name": "Denton", "role": "Admin"}, "tags": ["ip", "cidr", "network"]}`;
      updateCharCount();
      formatAll(2);
    }

    function clearText() {
      document.getElementById('json-in').value = '';
      setOutput('', null);
      updateCharCount();
      document.getElementById('status-bar').classList.add('hidden');
      document.getElementById('search-input').value = '';
      document.getElementById('search-count').textContent = '';
      currentSearchTerm = '';
    }
  </script>
</body>
</html>
