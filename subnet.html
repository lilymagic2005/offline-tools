<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><title>CIDR/子網掩碼計算 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-5">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">IPv4 子網掩碼與 CIDR 計算</h2>
          <p class="text-xs text-slate-500">推算網絡位址、廣播地址與可用主機範圍</p>
        </div>
      </div>

      <div class="flex flex-wrap items-end gap-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-bold text-slate-700 mb-1">IP 位址</label>
          <input type="text" id="ip" value="192.168.1.100" oninput="calc()" class="w-full font-mono-num text-sm p-2.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="w-36">
          <label class="block text-xs font-bold text-slate-700 mb-1">CIDR 前綴</label>
          <select id="cidr" onchange="calc()" class="w-full font-mono-num text-sm p-2.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
      </div>

      <div id="error-msg" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-lg font-medium"></div>

      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 pt-1"></div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const sel = document.getElementById('cidr');
    sel.innerHTML = Array.from({length: 33}, (_, i) => 32 - i).map(c => `<option value="${c}" ${c === 24 ? 'selected' : ''}>/${c}</option>`).join('');

    function isValidIpv4(ip) {
      const parts = ip.split('.');
      if (parts.length !== 4) return false;
      return parts.every(p => {
        if (!/^\d+$/.test(p)) return false;
        const n = parseInt(p, 10);
        return n >= 0 && n <= 255;
      });
    }

    function ipToInt(ip) { 
      return ip.split('.').reduce((a, b) => ((a << 8) + parseInt(b, 10)) >>> 0, 0); 
    }
    
    function intToIp(i) { 
      return [(i >>> 24) & 255, (i >>> 16) & 255, (i >>> 8) & 255, i & 255].join('.'); 
    }

    function calc() {
      const ipStr = document.getElementById('ip').value.trim();
      const cidr = parseInt(document.getElementById('cidr').value, 10);
      const errEl = document.getElementById('error-msg');
      const grid = document.getElementById('grid');

      if (!isValidIpv4(ipStr)) {
        errEl.textContent = '✕ 請輸入有效的 IPv4 地址（格式如 192.168.1.1）';
        errEl.classList.remove('hidden');
        grid.innerHTML = '';
        return;
      }
      errEl.classList.add('hidden');

      const ipInt = ipToInt(ipStr);
      const mask = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
      const net = (ipInt & mask) >>> 0;
      const bcast = (net | (~mask >>> 0)) >>> 0;

      let usableRange = '';
      let totalHosts = 0;

      if (cidr === 32) {
        usableRange = `${intToIp(net)} (單一主機)`;
        totalHosts = 1;
      } else if (cidr === 31) {
        usableRange = `${intToIp(net)} ~${intToIp(bcast)} (RFC 3021 點對點)`;
        totalHosts = 2;
      } else {
        usableRange = `${intToIp(net + 1)} ~${intToIp(bcast - 1)}`;
        totalHosts = Math.pow(2, 32 - cidr) - 2;
      }

      const items = [
        { label: '網絡位址 (Network)', val: intToIp(net), icon: '🌐' },
        { label: '廣播位址 (Broadcast)', val: cidr >= 31 ? '無廣播' : intToIp(bcast), icon: '📢' },
        { label: '子網掩碼 (Subnet Mask)', val: intToIp(mask), icon: '🎭' },
        { label: '可用主機範圍', val: usableRange, icon: '💻' },
        { label: '可用主機數', val: `${totalHosts.toLocaleString()} 個`, icon: '🔢' },
        { label: 'CIDR 標記', val: `${intToIp(net)}/${cidr}`, icon: '🏷️' }
      ];

      grid.innerHTML = items.map((c, idx) => `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex justify-between items-center">
          <div>
            <div class="text-xs text-slate-500 mb-1">${c.icon}${c.label}</div>
