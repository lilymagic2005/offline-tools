<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>SQL 格式化與美化 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">SQL 查詢語法格式化與美化器</h2>
          <p class="text-xs text-slate-500">標準 SQL 關鍵字智慧換行縮排、關鍵字大寫轉換及單行壓縮</p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300">範例 SQL</button>
          <button onclick="clearText()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-semibold rounded-lg border border-slate-300">清空</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="formatSQL(2)" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 shadow-xs">2 格縮排美化</button>
          <button onclick="formatSQL(4)" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 shadow-xs">4 格縮排美化</button>
          <button onclick="minifySQL()" class="px-3.5 py-1.5 bg-white border border-slate-300 text-xs font-bold rounded-lg hover:border-blue-500 hover:text-blue-600 shadow-xs">單行壓縮 (Minify)</button>
          <label class="flex items-center gap-1.5 text-xs text-slate-700 ml-2 cursor-pointer select-none">
            <input type="checkbox" id="opt-uppercase" checked onchange="formatSQL(2)" class="rounded text-blue-600">
            <span>關鍵字自動大寫 (UPPERCASE)</span>
          </label>
        </div>
        <button onclick="Utils.copyText('sql-out', this)" class="px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold rounded-lg hover:bg-blue-100">複製結果</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div>
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
            <span>原始 SQL 輸入</span>
            <span id="stat-in" class="font-mono-num font-normal text-slate-400">0 字元</span>
          </div>
          <textarea id="sql-in" rows="18" oninput="formatSQL(2)" placeholder="在此貼上混亂的 SQL 查詢指令..." class="w-full font-mono-num text-xs sm:text-sm p-3.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
            <span>美化排版輸出</span>
            <span id="stat-out" class="font-mono-num font-normal text-slate-400">0 行</span>
          </div>
          <textarea id="sql-out" rows="18" readonly class="w-full font-mono-num text-xs sm:text-sm p-3.5 bg-slate-100/70 border border-slate-300 rounded-xl focus:outline-none"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const KEYWORDS = [
      'SELECT', 'FROM', 'WHERE', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'OUTER JOIN', 'JOIN',
      'ON', 'AND', 'OR', 'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET',
      'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'UNION ALL', 'UNION',
      'CREATE TABLE', 'ALTER TABLE', 'DROP TABLE', 'AS', 'IN', 'BETWEEN', 'NOT', 'NULL', 'IS'
    ];

    function formatSQL(indentSize = 2) {
      const raw = document.getElementById('sql-in').value;
      const upper = document.getElementById('opt-uppercase').checked;
      const outEl = document.getElementById('sql-out');
      document.getElementById('stat-in').textContent = `${raw.length} 字元`;

      if (!raw.trim()) {
        outEl.value = '';
        document.getElementById('stat-out').textContent = '0 行';
        return;
      }

      let sql = raw.replace(/\s+/g, ' ').trim();
      const indent = ' '.repeat(indentSize);

      // 主要換行保留詞
      const newlineKeywords = [
        'SELECT', 'FROM', 'WHERE', 'GROUP BY', 'HAVING', 'ORDER BY', 'LIMIT',
        'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'JOIN', 'UNION ALL', 'UNION',
        'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM'
      ];

      newlineKeywords.forEach(kw => {
        const reg = new RegExp(`\\b${kw}\\b`, 'gi');
        sql = sql.replace(reg, `\n${kw}`);
      });

      sql = sql.replace(/\bAND\b/gi, `\n${indent}AND`);
      sql = sql.replace(/\bOR\b/gi, `\n${indent}OR`);

      if (upper) {
        KEYWORDS.forEach(kw => {
          const reg = new RegExp(`\\b${kw}\\b`, 'gi');
          sql = sql.replace(reg, kw);
        });
      }

      const lines = sql.split('\n').map(l => l.trim()).filter(Boolean);
      const res = lines.join('\n');
      outEl.value = res;
      document.getElementById('stat-out').textContent = `${lines.length} 行`;
    }

    function minifySQL() {
      const raw = document.getElementById('sql-in').value;
      const res = raw.replace(/\s+/g, ' ').trim();
      document.getElementById('sql-out').value = res;
      document.getElementById('stat-out').textContent = '1 行';
    }

    function loadSample() {
      document.getElementById('sql-in').value = `select u.id, u.name, o.order_id, sum(o.amount) as total from users u left join orders o on u.id = o.user_id where u.status = 'active' and o.created_at >= '2026-01-01' group by u.id, u.name having count(o.order_id) > 1 order by total desc limit 20;`;
      formatSQL(2);
    }

    function clearText() {
      document.getElementById('sql-in').value = '';
      formatSQL(2);
    }

    window.addEventListener('DOMContentLoaded', loadSample);
  </script>
</body>
</html>
