<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>離線實用工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex overflow-hidden">

  <!-- 手機版側邊欄遮罩 -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/50 z-40 lg:hidden hidden transition-opacity"></div>

  <!-- 行動端懸浮展開目錄按鈕 -->
  <button onclick="toggleSidebar(true)" class="lg:hidden fixed bottom-4 right-4 z-30 p-3 bg-slate-900 text-white rounded-full shadow-lg hover:bg-slate-800 focus:outline-none" title="開啟選單">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <!-- 左側邊欄目錄 (Sidebar) -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-200 flex flex-col transition-transform duration-200 ease-in-out -translate-x-full lg:translate-x-0 lg:static lg:inset-auto shrink-0 border-r border-slate-800">
    <div class="h-16 flex items-center justify-between px-5 border-b border-slate-800 bg-slate-950/40">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
          🛠️
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wide text-white">離線實用工具箱</h1>
          <p class="text-[11px] text-slate-400">本機運算 • 隱私安全</p>
        </div>
      </div>
      <button onclick="toggleSidebar(false)" class="lg:hidden text-slate-400 hover:text-white p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 工具目錄選單 -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="nav-list"></nav>

    <div class="p-3 border-t border-slate-800/80 text-center text-slate-500 text-xs">
      <span>純前端執行 • 無伺服器傳輸</span>
    </div>
  </aside>

  <!-- 中央滿版 Workspace -->
  <main class="flex-1 h-full w-full bg-slate-100 overflow-hidden relative">
    <iframe id="workspace-frame" class="w-full h-full border-none block" src="convertor.html"></iframe>
  </main>

  <script>
    const tools = [
      { id: 'convertor', file: 'convertor.html', name: '單位換算器', icon: '📏' },
      { id: 'json',      file: 'json.html',      name: 'JSON 格式化', icon: '🔣' },
      { id: 'yamlcmp',   file: 'yaml-compare.html', name: '多 YAML 比對器', icon: '📑' }, // <-- 新增此項
      { id: 'curl',      file: 'curl.html',      name: 'cURL 指令生成器', icon: '🌐' },
      { id: 'sql',       file: 'sql.html',       name: 'SQL 格式化與美化', icon: '🗄️' },
      { id: 'color',     file: 'color.html',     name: 'CSS / 顏色轉換器', icon: '🎨' },
      { id: 'mdtable',   file: 'mdtable.html',   name: 'Markdown 表格格式化', icon: '📑' },
      { id: 'csv',       file: 'csv.html',       name: 'CSV/Excel 轉換', icon: '📊' },
      { id: 'regex',     file: 'regex.html',     name: '正規表達式測試', icon: '🔍' },
      { id: 'base64',    file: 'base64.html',    name: 'Base64 編解碼', icon: '🔐' },
      { id: 'case',      file: 'case.html',      name: '大小寫轉換', icon: '🔤' },
      { id: 'dedupe',    file: 'dedupe.html',    name: '去重與排序', icon: '📋' },
      { id: 'timestamp', file: 'timestamp.html', name: '時間戳與日期', icon: '🕒' },
      { id: 'diff',      file: 'diff.html',      name: '文本差異比對', icon: '⚖️' },
      { id: 'subnet',    file: 'subnet.html',    name: 'CIDR/子網計算', icon: '🧮' }
    ];

    let activeTool = tools[0];

    function initSidebar() {
      const nav = document.getElementById('nav-list');
      nav.innerHTML = tools.map(tool => `
        <button 
          id="btn-${tool.id}" 
          onclick="switchTool('${tool.id}')" 
          class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 text-slate-300 hover:text-white hover:bg-slate-800"
        >
          <span class="text-base">${tool.icon}</span>
          <span class="truncate">${tool.name}</span>
        </button>
      `).join('');

      updateActiveUI();
    }

    function switchTool(toolId) {
      const selected = tools.find(t => t.id === toolId);
      if (!selected) return;
      activeTool = selected;
      document.getElementById('workspace-frame').src = selected.file;
      updateActiveUI();
      toggleSidebar(false);
    }

    function updateActiveUI() {
      tools.forEach(tool => {
        const btn = document.getElementById(`btn-${tool.id}`);
        if (!btn) return;
        if (tool.id === activeTool.id) {
          btn.className = 'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 bg-blue-600 text-white shadow-md';
        } else {
          btn.className = 'w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 text-slate-400 hover:text-slate-200 hover:bg-slate-800/80';
        }
      });
    }

    function toggleSidebar(open) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      const hash = window.location.hash.replace('#', '');
      if (hash && tools.some(t => t.id === hash)) {
        switchTool(hash);
      }
    });
  </script>
</body>
</html>
