<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><title>Base64 編解碼 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      
      <div class="flex flex-wrap justify-between items-center gap-3 pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">Base64 編碼與解碼</h2>
          <p class="text-xs text-slate-500">支援純文字與本地檔案轉換，可選 URL-Safe 格式</p>
        </div>
        <div class="flex gap-2">
          <button onclick="swap()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition-colors flex items-center gap-1">
            <span>⇄</span> 交換輸入/輸出
          </button>
          <button onclick="clearAll()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-semibold rounded-lg border border-slate-300 transition-colors">
            清空
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex flex-wrap items-center gap-3">
          <div class="inline-flex p-1 bg-white rounded-lg border border-slate-300">
            <button id="mode-enc" onclick="setMode('encode')" class="px-4 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white shadow-xs transition-colors">編碼 (Encode)</button>
            <button id="mode-dec" onclick="setMode('decode')" class="px-4 py-1.5 text-xs font-bold rounded-md text-slate-600 hover:text-slate-900 transition-colors">解碼 (Decode)</button>
          </div>
          
          <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer select-none">
            <input type="checkbox" id="b64-urlsafe" onchange="transform()" class="rounded text-blue-600 focus:ring-blue-500">
            <span>URL-Safe 格式 (- / _)</span>
          </label>
        </div>

        <div>
          <label class="px-3.5 py-1.5 bg-white text-slate-700 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer hover:border-blue-500 hover:text-blue-600 transition-colors inline-flex items-center gap-1 shadow-xs">
            <span>📁</span> 選擇檔案轉 Base64
            <input type="file" id="file-input" class="hidden" onchange="handleFile(event)">
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div>
          <div class="flex justify-between text-xs font-bold text-slate-700 mb-1.5">
            <span id="input-label">明文輸入</span>
            <span id="in-count" class="font-mono-num font-normal text-slate-400">0 字元</span>
          </div>
          <textarea id="b64-input" rows="14" oninput="transform()" placeholder="在此鍵入或貼上內容..." class="w-full font-mono-num text-sm p-3.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
        </div>
        
        <div>
          <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
            <span id="output-label">Base64 結果</span>
            <div class="flex items-center gap-2">
              <span id="out-count" class="font-mono-num font-normal text-slate-400">0 字元</span>
              <button onclick="Utils.copyText('b64-output', this)" class="px-2.5 py-1 bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold rounded-lg hover:bg-blue-100 transition-colors">複製結果</button>
            </div>
          </div>
          <textarea id="b64-output" rows="14" readonly placeholder="結果顯示在此..." class="w-full font-mono-num text-sm p-3.5 bg-slate-100/70 border border-slate-300 rounded-xl focus:outline-none"></textarea>
          <div id="error-bar" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-lg mt-2 font-medium"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    let mode = 'encode';

    function setMode(m) {
      mode = m;
      const btnEnc = document.getElementById('mode-enc');
      const btnDec = document.getElementById('mode-dec');

      if (m === 'encode') {
        btnEnc.className = 'px-4 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white shadow-xs transition-colors';
        btnDec.className = 'px-4 py-1.5 text-xs font-bold rounded-md text-slate-600 hover:text-slate-900 transition-colors';
      } else {
        btnDec.className = 'px-4 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white shadow-xs transition-colors';
        btnEnc.className = 'px-4 py-1.5 text-xs font-bold rounded-md text-slate-600 hover:text-slate-900 transition-colors';
      }

      document.getElementById('input-label').textContent = m === 'encode' ? '明文輸入' : 'Base64 輸入';
      document.getElementById('output-label').textContent = m === 'encode' ? 'Base64 結果' : '明文結果';
      transform();
    }

    function transform() {
      const inVal = document.getElementById('b64-input').value;
      const outEl = document.getElementById('b64-output');
      const errEl = document.getElementById('error-bar');
      const safe = document.getElementById('b64-urlsafe').checked;
      
      document.getElementById('in-count').textContent = `${inVal.length} 字元`;
      errEl.classList.add('hidden');

      if (!inVal) { 
        outEl.value = ''; 
        document.getElementById('out-count').textContent = '0 字元'; 
        return; 
      }

      try {
        if (mode === 'encode') {
          const bytes = new TextEncoder().encode(inVal);
          let bin = '';
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          let res = btoa(bin);
          if (safe) res = res.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          outEl.value = res;
        } else {
          let norm = inVal.trim().replace(/-/g, '+').replace(/_/g, '/');
          while (norm.length % 4) norm += '=';
          const bin = atob(norm);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          outEl.value = new TextDecoder().decode(bytes);
        }
      } catch (e) {
        outEl.value = ''; 
        errEl.textContent = `✕ 錯誤：${e.message || '無效的格式或字串'}`; 
        errEl.classList.remove('hidden');
      }

      document.getElementById('out-count').textContent = `${outEl.value.length} 字元`;
    }

    function swap() {
      const i = document.getElementById('b64-input');
      const o = document.getElementById('b64-output');
      i.value = o.value;
      setMode(mode === 'encode' ? 'decode' : 'encode');
    }

    function clearAll() {
      document.getElementById('b64-input').value = '';
      document.getElementById('b64-output').value = '';
      document.getElementById('error-bar').classList.add('hidden');
      transform();
    }

    function handleFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        setMode('encode');
        document.getElementById('b64-input').value = `[檔案: ${f.name} (${f.size} bytes)]`;
        document.getElementById('b64-output').value = ev.target.result;
        document.getElementById('out-count').textContent = `${ev.target.result.length} 字元`;
      };
      r.readAsDataURL(f);
      e.target.value = '';
    }
  </script>
</body>
</html>
