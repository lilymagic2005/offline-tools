<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><title>文本差異比對 - 離線工具箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 lg:p-5 min-h-screen">
  <div class="max-w-[1720px] mx-auto">
    <div id="header-mount"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 md:p-6 space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200">
        <div>
          <h2 class="text-base font-bold text-slate-800">文本差異比對器 (Diff)</h2>
          <p class="text-xs text-slate-500">以行爲單位對比文字出入，支援增減標記</p>
        </div>
        <button onclick="loadSample()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg border border-slate-300">範例比對</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">原始文本 (Original)</label>
          <textarea id="t-orig" rows="7" class="w-full font-mono-num text-sm p-3 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">修改後文本 (Modified)</label>
          <textarea id="t-mod" rows="7" class="w-full font-mono-num text-sm p-3 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>

      <div class="flex justify-center">
        <button onclick="runDiff()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl transition-colors">開始比對</button>
      </div>

      <div id="diff-wrap" class="hidden border border-slate-200 rounded-xl overflow-hidden mt-3">
        <div id="diff-out" class="font-mono-num text-xs p-4 bg-white divide-y divide-slate-100 max-h-[450px] overflow-auto"></div>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    function runDiff() {
      const o = document.getElementById('t-orig').value.split('\n');
      const m = document.getElementById('t-mod').value.split('\n');
      const wrap = document.getElementById('diff-wrap');
      const out = document.getElementById('diff-out');
      wrap.classList.remove('hidden');

      const maxLen = Math.max(o.length, m.length);
      let html = '';

      for (let idx = 0; idx < maxLen; idx++) {
        const l1 = o[idx];
        const l2 = m[idx];

        if (l1 === l2) {
          html += `<div class="py-1 px-2 text-slate-600 flex gap-3"><span class="w-8 text-slate-300 text-right select-none">${idx+1}</span><span class="w-3 text-slate-300 font-mono"> </span><span>${escape(l1 || '')}</span></div>`;
        } else {
          if (l1 !== undefined) {
            html += `<div class="py-1 px-2 bg-rose-50 text-rose-800 flex gap-3 border-l-4 border-rose-500"><span class="w-8 text-rose-400 text-right select-none">${idx+1}</span><span class="w-3 font-bold text-rose-500 font-mono">-</span><span>${escape(l1)}</span></div>`;
          }
          if (l2 !== undefined) {
            html += `<div class="py-1 px-2 bg-emerald-50 text-emerald-800 flex gap-3 border-l-4 border-emerald-500"><span class="w-8 text-emerald-400 text-right select-none">${idx+1}</span><span class="w-3 font-bold text-emerald-500 font-mono">+</span><span>${escape(l2)}</span></div>`;
          }
        }
      }

      out.innerHTML = html;
      function escape(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    }

    function loadSample() {
      document.getElementById('t-orig').value = `1. Simon 00:45\n2. Denton 01:00\n3. Benny 23:30`;
      document.getElementById('t-mod').value = `1. Simon 00:45\n2. Denton 01:00\n3. Benny 19:00 (改時)\n4. Tommy 02:00 (新增)`;
      runDiff();
    }
  </script>
</body>
</html>
